naftiko: 1.0.0-alpha2
info:
  label: Amazon MemoryDB — Events
  description: 'Amazon MemoryDB — Events. 1 operations. Lead operation: Amazon MemoryDB DescribeEvents. Self-contained Naftiko
    capability covering one Amazon Memorydb business surface.'
  tags:
  - Amazon Memorydb
  - Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_MEMORYDB_API_KEY: AMAZON_MEMORYDB_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-memorydb-events
    baseUri: https://memory-db.us-east-1.amazonaws.com
    description: Amazon MemoryDB — Events business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events
      operations:
      - name: describeevents
        method: GET
        description: Amazon MemoryDB DescribeEvents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_MEMORYDB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-memorydb-events-rest
    port: 8080
    description: REST adapter for Amazon MemoryDB — Events. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: GET
        name: describeevents
        description: Amazon MemoryDB DescribeEvents
        call: amazon-memorydb-events.describeevents
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-memorydb-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon MemoryDB — Events. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: amazon-memorydb-describeevents
      description: Amazon MemoryDB DescribeEvents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-memorydb-events.describeevents
      outputParameters:
      - type: object
        mapping: $.
